/* Thanh điều hướng chính */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 50px;
    background-color: transparent; /* Nền trong suốt giống mẫu */
    font-family: sans-serif;
}

/* Tên chữ bên góc trái */
.logo {
    font-size: 24px;
    font-weight: bold;
    color: #333;
}

/* Danh sách menu */
.nav-links {
    display: flex;
    list-style: none;
    gap: 20px; /* Khoảng cách giữa các chữ */
    margin: 0;
    padding: 0;
}

.nav-links li a {
    text-decoration: none;
    color: #666; /* Màu chữ xám nhẹ */
    font-size: 16px;
    padding: 8px 16px;
    transition: 0.3s;
}

/* Nút Trang chủ được bo tròn xanh nhạt */
.nav-links li a.active {
    background-color: #e0f2fe; /* Màu xanh dương nhạt */
    color: #0284c7; /* Chữ xanh đậm hơn */
    border-radius: 20px; /* Bo tròn góc */
    font-weight: bold;
}

/* Ẩn nút 3 gạch trên máy tính */
.menu-toggle {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 4px;
}

.menu-toggle span {
    width: 25px;
    height: 3px;
    background-color: #333;
    transition: 0.3s;
}

/* Cấu hình hiển thị mượt mà trên điện thoại */
@media (max-width: 768px) {
    .menu-toggle {
        display: flex; /* Hiện nút 3 gạch khi màn hình nhỏ */
    }
    .nav-links {
        display: none; /* Ẩn menu ngang */
        flex-direction: column;
        position: absolute;
        top: 70px;
        left: 0;
        width: 100%;
        background-color: white;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .nav-links.show {
        display: flex; /* Hiện lại thành hàng dọc khi bấm nút */
    }
}
